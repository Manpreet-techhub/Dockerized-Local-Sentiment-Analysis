<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Sentiment Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Local Sentiment Analyzer</h1>

    <form method="post">
        <textarea name="text" placeholder="Enter text to analyze sentiment..." required></textarea>
        <button type="submit">Analyze Sentiment</button>
    </form>
    {% if sentiment %}
        <div class="result">
            <h2>Sentiment Analysis Result</h2>
            <p><strong>Sentiment:</strong> {{ sentiment }}</p>
            <p><strong>Sentiment:</strong> {{ confidence }}</p>
        </div>
    {% endif %}
</body>
</html>
